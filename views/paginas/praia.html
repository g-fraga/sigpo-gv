        <p class="trilha"><a href="/praias">Praias e postos</a> / {{regiao}}</p>

        <p id="agora" role="status">Carregando a situação dos postos...</p>
        <dl class="resumo-praia" id="resumo"></dl>

    <section class="secao">

        </div>
        <div class="mapa" id="mapa" role="region" aria-label="Mapa dos postos desta praia"></div>
      </div>
    </section>
